name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Validate skills against the Agent Skills spec
        run: |
          for dir in skills/*/; do
            uvx --from skills-ref agentskills validate "$dir"
          done

      - name: Validate Claude plugin manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.308 plugin validate .
